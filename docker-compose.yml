services:
  dashboard-web:
    build: ./web
    ports:
      - "127.0.0.1:8390:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./forge.html:/usr/share/nginx/html/forge.html:ro
      - ./css:/usr/share/nginx/html/css:ro
      - ./js:/usr/share/nginx/html/js:ro
    depends_on:
      - dashboard-api
    security_opt:
      - no-new-privileges:true
  dashboard-api:
    build: ./api
    environment:
      DASHBOARD_TOKEN: ${DASHBOARD_TOKEN:?Run python3 scripts/init_demo.py first}
      DASHBOARD_DATA_DIR: /data
      DASHBOARD_LLM_DIR: /llm
      DASHBOARD_PUBLIC_BASE_URL: http://localhost:8390
    volumes:
      - ./data:/data
      - ./llm:/llm
    security_opt:
      - no-new-privileges:true
