# Security headers
map $sent_http_content_type $csp {
    default     "";
    "~text/html" "default-src 'self'; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; script-src 'self' https://cdn.jsdelivr.net; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'";
}

map $http_x_forwarded_proto $dashboard_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy $csp always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Deny sensitive static paths (regex locations — processed after prefix but before try_files fallback)
    # NOTE: /api/ is NOT blocked here — it is proxied below.
    location ~ ^/(\.git|\.git/)            { return 404; }
    location ~ ^/data/                     { return 404; }
    location ~ ^/llm/                      { return 404; }
    location ~ ^/docs/                     { return 404; }
    location ~ ^/web/                      { return 404; }
    location ~ ^/scripts/                  { return 404; }
    location = /docker-compose.yml         { return 404; }
    location = /README.md                  { return 404; }
    location = /.gitignore                 { return 404; }
    location = /.token                     { return 404; }
    location = /.telegram.env              { return 404; }
    location = /chat.html                  { return 404; }
    location ~ /\.                         { return 404; }

    location = /forge {
        try_files /forge.html =404;
    }

    # Frontend assets
    location ~* \.(html|js|css)$ {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy $csp always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control "no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # API and MCP proxies must win over regex deny rules.
    location ^~ /api/ {
        proxy_pass http://dashboard-api:8391;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $dashboard_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 130s;
    }

    location ^~ /mcp {
        proxy_pass http://dashboard-api:8391;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $dashboard_forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
